name: Deploy to OVH
on: { push: { branches: [main] } }
jobs:
  deploy: { runs-on: ubuntu-latest, steps: [ { name: Checkout, uses: "actions/checkout@v4" }, { name: "Prepare index.html", run: "cp Accueil.html index.html" }, { name: "Deploy via FTP", uses: "SamKirkland/FTP-Deploy-Action@v4.3.5", with: { server: "${{ secrets.FTP_SERVER }}", username: "${{ secrets.FTP_USERNAME }}", password: "${{ secrets.FTP_PASSWORD }}", server-dir: "./www/", exclude: ["**/.git*", "**/.git*/**", "**/.github/**", "**/*.py", "**/*.json", "**/README.md"] } } ] }
