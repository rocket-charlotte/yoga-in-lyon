name: Deploy to OVH
on: { push: { branches: [main] } }
jobs:
  deploy: { runs-on: ubuntu-latest, steps: [ { name: Checkout, uses: "actions/checkout@v4" }, { name: "Prepare dist folder", run: "mkdir -p dist && cp *.html *.jpg *.png *.ico dist/ && cp dist/Accueil.html dist/index.html" }, { name: "Passe SEO (pages studios et styles, photos, sitemap, robots, htaccess)", env: { SEO_FETCH_PHOTOS: "1" }, run: "pip install --quiet pillow && python3 seo/seo_build.py dist" }, { name: "Deploy via FTP", uses: "SamKirkland/FTP-Deploy-Action@v4.3.5", with: { server: "${{ secrets.FTP_SERVER }}", username: "${{ secrets.FTP_USERNAME }}", password: "${{ secrets.FTP_PASSWORD }}", local-dir: "dist/", server-dir: "./www/" } } ] }
