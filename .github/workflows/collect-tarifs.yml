name: Collecte tarifs studios
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["seo/collect/trigger.txt"]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collecte
        run: python3 seo/collect/collect_tarifs.py /tmp/collecte
      - name: Pousse le résultat sur la branche collecte
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan collecte
          git rm -rq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/collecte/* .
          git add -A
          git commit -qm "Collecte tarifs $(date -u +%F)"
          git push -f origin collecte
